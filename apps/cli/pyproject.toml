[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yp-cli"
version = "0.1.0"
description = "MegaIoT CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "yp-shared>=0.1.0"
]

[project.scripts]
yp = "yp_cli.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yp_cli"]
