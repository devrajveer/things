version: '3.8'

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:latest
    command: valkey-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infra/local/nats/nats.conf:/etc/nats/nats.conf
      - nats_data:/data

  emqx:
    image: emqx:5
    environment:
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
      - EMQX_AUTH__HTTP__AUTH_REQ=http://api:8000/internal/mqtt/auth
      - EMQX_ACL__HTTP__ACL_REQ=http://api:8000/internal/mqtt/acl
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - ./infra/local/emqx/emqx.conf:/opt/emqx/etc/emqx.conf
      - emqx_data:/opt/emqx/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    volumes:
      - ./infra/local/chirpstack:/etc/chirpstack
    ports:
      - "8090:8080"
    depends_on:
      - postgres
      - redis

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  emqx_data:
  minio_data:
