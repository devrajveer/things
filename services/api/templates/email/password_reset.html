<!DOCTYPE html>
<html>
<body>
    <h2>Hi {{ name }},</h2>
    <p>We received a request to reset your password for your MegaIoT account.</p>
    <p>Please use the following link to reset your password:</p>
    <p><a href="http://localhost:3000/auth/password-reset?token={{ token }}">Reset Password</a></p>
    <p>This link will expire in 1 hour.</p>
    <p>If you did not request this, please ignore this email.</p>
</body>
</html>
