[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yp-api"
version = "0.1.0"
description = "MegaIoT API Service"
requires-python = ">=3.12"
dependencies = [
    "yp-shared>=0.1.0",
    "fastapi>=0.100",
    "pydantic[email]",
    "uvicorn[standard]",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "passlib[argon2]",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "aiosmtplib>=3.0",
    "Jinja2>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yp_api"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
]

